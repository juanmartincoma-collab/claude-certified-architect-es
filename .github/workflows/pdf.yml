name: Generar PDFs

on:
  push:
    branches: [main]
    paths:
      - "profesional/**.md"
      - "foundations/**.md"
      - "glosario.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Instalar pandoc y LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended texlive-lang-spanish

      - name: Construir los PDF
        run: |
          mkdir -p pdf
          construir () {
            pandoc "$1" -o "pdf/$2" \
              --pdf-engine=xelatex \
              -V lang=es -V geometry:margin=2.4cm \
              -V mainfont="DejaVu Serif" -V monofont="DejaVu Sans Mono" \
              -V colorlinks=true -V linkcolor=[HTML]{E11D48} -V urlcolor=[HTML]{E11D48} \
              --toc --toc-depth=2
          }
          construir profesional/guia.md        CCAR-P-guia.pdf
          construir profesional/examen.md      CCAR-P-examen.pdf
          construir profesional/respuestas.md  CCAR-P-respuestas.pdf
          construir foundations/guia.md        CCAR-F-guia.pdf
          construir foundations/examen.md      CCAR-F-examen.pdf
          construir foundations/respuestas.md  CCAR-F-respuestas.pdf
          construir glosario.md                glosario.pdf

      - name: Publicar los PDF en el repositorio
        run: |
          cp -f pdf/*.pdf docs/pdf/ 2>/dev/null || { mkdir -p docs/pdf && cp -f pdf/*.pdf docs/pdf/; }
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pdf docs/pdf
          git diff --staged --quiet || git commit -m "Rebuild the PDF versions from the Markdown sources"
          git push
